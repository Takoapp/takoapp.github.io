<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo</title><style>:root{--ac:#e2342d}*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0e1215;color:#e9eef1}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#12171b;border-bottom:1px solid #26303a}header img{width:44px;height:44px;border-radius:10px;object-fit:contain;background:#fff}header h1{margin:0;font-size:19px}#cats{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}#cats button{flex:none;border:1px solid #2b353f;background:#161c21;color:#e9eef1;border-radius:18px;padding:7px 14px;font:600 13px inherit}#cats button.on{background:var(--ac);border-color:var(--ac)}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:6px 16px 110px}.p{background:#161c21;border:1px solid #26303a;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.p img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#0b0f12}.p b{padding:8px 10px 2px}.p small{padding:0 10px;color:#93a2ab}.p .pr{padding:6px 10px;font-weight:800;color:#ff6157}.p button{margin:auto 10px 10px;border:0;border-radius:10px;padding:9px;background:var(--ac);color:#fff;font-weight:700}#car{position:fixed;left:12px;right:12px;bottom:12px;display:none;border:0;border-radius:16px;padding:14px;background:#1f9d4c;color:#fff;font:800 16px inherit;box-shadow:0 8px 24px rgba(0,0,0,.5)}#mant{display:none;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:30px}#mant h1{font-size:24px;margin:0 0 8px}#mant p{color:#93a2ab;margin:0}</style></head><body><div id="mant"><div><h1>Página en mantenimiento</h1><p>Vuelve a visitarnos pronto.</p></div></div><header hidden><img id="logo" alt="" hidden><h1 id="neg"></h1></header><div id="cats"></div><main id="lista"></main><button id="car"></button><script>(function(){var $=function(i){return document.getElementById(i)},D=null,cat="",car={};function precio(n){return "$"+Number(n||0).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2})}function mant(){$("mant").style.display="flex";document.title="En mantenimiento"}function pinta(){var ps=(D.productos||[]).filter(function(p){return !cat||p.cat===cat});$("lista").innerHTML=ps.map(function(p,i){return "<div class=p>"+(p.foto?"<img loading=lazy src=\""+p.foto+"\" alt=\"\">":"")+"<b></b><small></small><div class=pr>"+(p.precio?precio(p.precio):"")+"</div>"+(D.wa?"<button data-i=\""+(p.id||i)+"\">Agregar</button>":"")+"</div>"}).join("");Array.prototype.forEach.call($("lista").children,function(el,i){el.querySelector("b").textContent=ps[i].nombre||"";el.querySelector("small").textContent=ps[i].desc||""});$("cats").innerHTML=(D.cats||[]).length?"<button data-c=\"\" class=\""+(cat?"":"on")+"\">Todo</button>"+D.cats.map(function(c){return "<button data-c=\""+String(c).replace(/"/g,"")+"\" class=\""+(c===cat?"on":"")+"\"></button>"}).join(""):"";Array.prototype.forEach.call($("cats").querySelectorAll("[data-c]"),function(b,i){if(i)b.textContent=D.cats[i-1]});var n=Object.keys(car).reduce(function(a,k){return a+car[k]},0);$("car").style.display=n?"block":"none";$("car").textContent="Enviar pedido por WhatsApp ("+n+")"}document.addEventListener("click",function(e){var c=e.target.closest("[data-c]");if(c){cat=c.dataset.c;pinta();return}var b=e.target.closest("[data-i]");if(b){car[b.dataset.i]=(car[b.dataset.i]||0)+1;pinta();return}if(e.target.id==="car"){var t="Hola, me interesa:\n"+(D.productos||[]).filter(function(p,i){return car[p.id||i]}).map(function(p,i){return "• "+car[p.id||i]+" × "+p.nombre+(p.precio?" ("+precio(p.precio)+")":"")}).join("\n");location.href="https://wa.me/"+D.wa+"?text="+encodeURIComponent(t)}});fetch("datos.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){D=d;if(!d||d.mantenimiento)return mant();document.querySelector("header").hidden=false;$("neg").textContent=d.negocio||"";document.title=d.negocio||"Catálogo";if(d.logo){$("logo").src=d.logo;$("logo").hidden=false}if(d.color)document.documentElement.style.setProperty("--ac",d.color);pinta()}).catch(mant)})();</script></body></html>
