<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo</title>
<style>
/* Página de catálogo de cada suscriptor (Tako 9.44): la misma para todos; lee datos.json de su carpeta.
   20 diseños (d.tema 1–20) con colores, letras y acomodo propios. No lleva el nombre de nadie. */
:root{--bg:#0e1215;--bgi:none;--card:#161c21;--tx:#e9eef1;--ctx:#e9eef1;--mu:#93a2ab;--ln:#2a343c;--ac:#e2342d;--acx:#fff;--hb:transparent;--ht:var(--tx);--r:14px;--fh:system-ui,sans-serif;--fb:system-ui,sans-serif;--bw:1px;--sh:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);background-image:var(--bgi);background-size:var(--bgs,auto);color:var(--tx);font:16px/1.45 var(--fb);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.w{max-width:980px;margin:0 auto;padding:0 16px}
h1,h2,.fh{font-family:var(--fh);margin:0}
.up h1,.up h2{text-transform:uppercase;letter-spacing:.03em}
img{display:block}
/* encabezado */
#hd{padding:22px 0 6px}
#hd .w{display:flex;flex-direction:column;gap:12px}
.hrow{display:flex;align-items:center;gap:14px}
#logo{width:64px;height:64px;flex:none;border-radius:var(--r);object-fit:contain;background:#fff}
#logoX{width:64px;height:64px;flex:none;border-radius:var(--r);background:var(--ac);color:var(--acx);display:flex;align-items:center;justify-content:center;font:800 24px var(--fh)}
#neg{font-size:30px;line-height:1.05}
#sub{color:var(--mu);font-size:13px;letter-spacing:.18em;text-transform:uppercase}
#desc{margin:0;color:var(--mu);font-size:15.5px;line-height:1.55;white-space:pre-line}
#cont{display:flex;flex-wrap:wrap;gap:8px}
#cont a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:999px;border:var(--bw) solid var(--ln);background:var(--card);color:var(--ctx);text-decoration:none;font-size:14px}
#cont a.wa{background:#1fa855;border-color:#1fa855;color:#fff;font-weight:700}
.h-centro #hd .w{align-items:center;text-align:center}.h-centro .hrow{flex-direction:column}.h-centro #cont{justify-content:center}
.h-banda #hd{background:var(--hb);color:var(--ht);padding:28px 0 46px}.h-banda #desc,.h-banda #sub{color:var(--ht);opacity:.88}
.h-banda #hd .w{align-items:center;text-align:center}.h-banda .hrow{flex-direction:column}.h-banda #cont{justify-content:center}
.h-banda #logoX,.h-caja #logoX,.h-tienda #logoX{background:var(--ht);color:var(--hb)}
.h-banda #bus{margin-top:-28px;position:relative;box-shadow:0 8px 22px rgba(0,0,0,.14)}
.h-caja #hb{background:var(--hb);color:var(--ht);border-radius:var(--r);padding:18px;border:var(--bw) solid var(--ln);box-shadow:var(--sh);position:relative}
.h-caja #hb #desc,.h-caja #hb #sub{color:var(--ht);opacity:.85}
.h-portada #hero{height:230px;background:var(--card) center/cover no-repeat;margin:0 -16px;position:relative}
.h-portada #hd{padding-top:0}.h-portada .hrow{margin-top:-40px;position:relative;align-items:flex-end}
.h-portada #logo,.h-portada #logoX{width:84px;height:84px;border:4px solid var(--bg)}
.h-tienda #hd{background:var(--hb);color:var(--ht);padding:14px 0}.h-tienda #logo,.h-tienda #logoX{width:44px;height:44px}.h-tienda #neg{font-size:21px}
.h-tienda #desc{color:var(--mu)}
/* buscador y categorías */
#bus{display:flex;align-items:center;gap:8px;background:var(--card);color:var(--ctx);border:var(--bw) solid var(--ln);border-radius:var(--r);padding:0 14px;min-height:48px;box-shadow:var(--sh)}
#bus input{flex:1;border:0;background:transparent;outline:none;min-width:0;padding:12px 0}
#bus svg{flex:none;opacity:.6}
#cats{display:flex;gap:8px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
#cats button{flex:none;min-height:40px;padding:0 16px;border:var(--bw) solid var(--ln);background:var(--card);color:var(--ctx);border-radius:999px;cursor:pointer}
#cats button.on{background:var(--ac);border-color:var(--ac);color:var(--acx);font-weight:700}
.r0 #cats button,.r0 #bus{border-radius:0}
/* secciones */
.sec{margin:26px 0 12px;font-size:22px;color:var(--tx)}
.nada{color:var(--mu);text-align:center;padding:30px 0}
/* tarjeta */
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.p{background:var(--card);color:var(--ctx);border:var(--bw) solid var(--ln);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh)}
.p .ft{width:100%;aspect-ratio:1/1;object-fit:cover;background:rgba(127,127,127,.15)}
.p .tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.p b{font-size:15px;line-height:1.25}
.p small{color:var(--mu);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font:800 17px var(--fh);color:var(--ac)}
.ink .pr{color:var(--ctx)}
.ag{margin-top:auto;min-height:42px;border:0;border-radius:calc(var(--r) * .7);background:var(--ac);color:var(--acx);font-weight:700;cursor:pointer}
.ag.on{outline:2px solid var(--ac);outline-offset:2px}
@media(min-width:700px){.dest .g{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
/* lista (menú) */
.l-lista .g,.lista{display:flex;flex-direction:column;gap:0}
.l-lista .p,.lista .p{flex-direction:row;align-items:center;gap:12px;border:0;border-bottom:1px dotted var(--ln);border-radius:0;background:transparent;box-shadow:none;padding:12px 0}
.l-lista .p .ft,.lista .p .ft{width:84px;height:84px;aspect-ratio:auto;border-radius:var(--r);flex:none}
.l-lista .p .tx,.lista .p .tx{padding:0}
.l-lista .p .ag,.lista .p .ag{margin:0;flex:none;padding:0 14px}
.lista .p{background:var(--card);border:var(--bw) solid var(--ln);border-radius:var(--r);padding:8px;margin-bottom:10px}
/* carrusel de destacados */
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.car .p{flex:none;width:78%;max-width:320px;scroll-snap-align:start;background:var(--ac);color:var(--acx);border:0}
.car .p .pr,.car .p small{color:var(--acx)}.car .p .ag{background:var(--acx);color:var(--ac)}
/* mosaico */
.l-mosaico .g{display:block;columns:2;column-gap:10px}
@media(min-width:700px){.l-mosaico .g{columns:3}}
.l-mosaico .p{break-inside:avoid;margin-bottom:10px;position:relative;border:0}
.l-mosaico .p .ft{aspect-ratio:auto;min-height:120px}
.l-mosaico .p:nth-child(3n+1) .ft{aspect-ratio:3/4}.l-mosaico .p:nth-child(3n+2) .ft{aspect-ratio:1/1}.l-mosaico .p:nth-child(3n) .ft{aspect-ratio:4/5}
.l-mosaico .p .tx{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;padding:30px 10px 10px}
.l-mosaico .p small{display:none}.l-mosaico .p .ag{min-height:36px;font-size:13px}.l-mosaico .p .pr{color:#fff}
/* carrito */
#car{position:fixed;left:12px;right:12px;bottom:12px;display:none;max-width:560px;margin:0 auto;border:0;border-radius:16px;min-height:54px;background:#1fa855;color:#fff;font-weight:800;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer}
#pie{color:var(--mu);font-size:12px;text-align:center;padding:30px 0 110px}
/* foto grande */
#vf{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:16px}
#vf img{max-width:100%;max-height:80vh;border-radius:10px}
#vf.on{display:flex}
/* adornos */
.deco{display:none}
.d-chispas #dch{display:block;height:64px;margin-bottom:-26px}
.d-franjas #fr1,.d-franjas #fr2{display:block;height:16px;background:repeating-linear-gradient(-45deg,var(--ac) 0 14px,#111 14px 28px)}
.d-adorno #ado{display:block;margin:0 auto;max-width:100%}
.d-remaches .rv{display:block;position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#8b8f93 60%,#4a4e52)}
.d-remaches .p{position:relative;padding-top:12px}
.d-remaches #hb{border:4px solid var(--ht);outline:3px solid var(--hb)}
.d-neon #neg{text-shadow:0 0 18px color-mix(in srgb,var(--ac) 45%,transparent)}.d-neon #bus{box-shadow:0 0 14px color-mix(in srgb,var(--ac) 30%,transparent);border-color:var(--ac)}
.d-brutal .p,.d-brutal #bus,.d-brutal #hb,.d-brutal #cats button{box-shadow:5px 5px 0 #000}
.d-revista #hd .w{border-bottom:3px double var(--ln);padding-bottom:14px}.d-revista #neg{font-size:46px}.d-revista #desc{font-style:italic;color:var(--tx)}
.d-revista .p{border:0;border-top:1px solid var(--ln);background:transparent;box-shadow:none}.d-revista .p .tx{padding:8px 0}
</style>
</head>

      '<div class="tx"><b>' + esc(p.nombre) + '</b>' + (p.desc ? '<small>' + esc(p.desc) + '</small>' : '') +
      (D.precios !== false && p.precio ? '<span class="pr">' + precio(p.precio) + '</span>' : '') +
      (con ? '<button type="button" class="ag' + (car[p.id] ? ' on' : '') + '" data-i="' + id + '">' + (car[p.id] ? 'En tu pedido (' + car[p.id] + ')' : 'Agregar al pedido') + '</button>' : '') +
      '</div></div>';
  }
  function pinta() {
    var t = T[+D.tema] || T[1], L = D.productos || [], qq = q.trim().toLowerCase();
    var ps = L.filter(function (p) {
      if (cat && p.cat !== cat) return false;
      return !qq || ((p.nombre || '') + ' ' + (p.desc || '') + ' ' + (p.cat || '')).toLowerCase().indexOf(qq) >= 0;
    });
    var dest = !cat && !qq ? ps.filter(function (p) { return p.top; }) : [];
    var resto = dest.length ? ps.filter(function (p) { return !p.top; }) : ps;
    var h = '', td = D.tdest || t[18];
    if (dest.length) {
      h += '<section class="dest"><h2 class="sec">' + esc(td) + '</h2>' + (t[16] === 'carrusel' ? '<div class="car">' : '<div class="g">') + dest.map(tarjeta).join('') + '</div></section>';
      if (resto.length) h += '<h2 class="sec">' + (t[16] === 'carrusel' ? 'Todo el catálogo' : 'Todos los productos') + '</h2>';
    } else if (cat || qq) h += '<h2 class="sec">' + esc(cat || 'Resultados') + ' (' + ps.length + ')</h2>';
    h += resto.length ? '<div class="g' + (t[16] === 'carrusel' ? ' lista' : '') + '">' + resto.map(tarjeta).join('') + '</div>' : dest.length ? '' : '<p class="nada">' + (qq ? 'No encontramos «' + esc(q) + '».' : 'Pronto agregaremos productos.') + '</p>';
    $('lista').innerHTML = h;
    $('cats').innerHTML = (D.cats || []).length ? ['<button type="button" data-c="" class="' + (cat ? '' : 'on') + '">Todo</button>'].concat(D.cats.map(function (c) { return '<button type="button" data-c="' + esc(c) + '" class="' + (c === cat ? 'on' : '') + '">' + esc(c) + '</button>'; })).join('') : '';
    var n = Object.keys(car).reduce(function (a, k) { return a + car[k]; }, 0);
    $('car').style.display = n ? 'block' : 'none';
    $('car').textContent = 'Enviar pedido por WhatsApp (' + n + ')';
  }
  function arma(d) {
    D = d;
    if (!d || d.mantenimiento) return mant();
    var t = tema();
    $('todo').hidden = false;
    document.title = d.negocio || 'Catálogo';
    $('neg').textContent = d.negocio || '';
    $('sub').textContent = d.lema || '';
    $('desc').textContent = d.desc || '';
    $('desc').hidden = !d.desc;
    if (d.logo) { $('logo').src = d.logo; $('logo').hidden = false; }
    else { $('logoX').hidden = false; $('logoX').textContent = String(d.negocio || '?').split(/\s+/).map(function (x) { return x.charAt(0); }).join('').slice(0, 2).toUpperCase(); }
    var c = '';
    if (d.wa && d.vercont !== false) c += '<a class="wa" href="https://wa.me/' + esc(d.wa) + '">WhatsApp</a>';
    if (d.tel && d.vercont !== false) c += '<a href="tel:' + esc(String(d.tel).replace(/[^0-9+]/g, '')) + '">Llamar ' + esc(d.tel) + '</a>';
    if (d.dir && d.vercont !== false) c += '<a href="https://maps.google.com/?q=' + encodeURIComponent(d.dir) + '" target="_blank" rel="noopener">' + esc(d.dir) + '</a>';
    $('cont').innerHTML = c;
    $('cont').hidden = !c;
    if (t[15] === 'portada') {
      var f = (d.productos || []).filter(function (p) { return p.foto; }), fp = f.filter(function (p) { return p.top; })[0] || f[0];
      $('hero').style.display = 'block';
      if (fp) $('hero').style.backgroundImage = 'url("' + String(fp.foto).replace(/"/g, '') + '")';
    }
    if (t[15] === 'tienda') $('hd').querySelector('.w').appendChild($('bus'));
    if ((t[17] || '').indexOf('chispas') >= 0) chispas();
    if ((t[17] || '').indexOf('remaches') >= 0) $('hb').insertAdjacentHTML('afterbegin', REM.replace(/deco /g, ''));
    $('pie').textContent = d.fecha ? 'Actualizado el ' + String(d.fecha).slice(0, 10).split('-').reverse().join('/') : '';
    pinta();
  }
  $('q').addEventListener('input', function () { q = this.value; pinta(); });
  document.addEventListener('click', function (e) {
    var c = e.target.closest('[data-c]');
    if (c) { cat = c.dataset.c; pinta(); return; }
    var b = e.target.closest('[data-i]');
    if (b) { car[b.dataset.i] = (car[b.dataset.i] || 0) + 1; pinta(); return; }
    var v = e.target.closest('[data-v]');
    if (v) { $('vf').querySelector('img').src = v.src; $('vf').classList.add('on'); return; }
    if (e.target.closest('#vf')) { $('vf').classList.remove('on'); return; }
    if (e.target.id === 'car') {
      var L = (D.productos || []).filter(function (p) { return car[p.id]; });
      var txt = 'Hola, me interesa:\n' + L.map(function (p) { return '• ' + car[p.id] + ' × ' + p.nombre + (D.precios !== false && p.precio ? ' (' + precio(p.precio) + ')' : ''); }).join('\n');
      location.href = 'https://wa.me/' + D.wa + '?text=' + encodeURIComponent(txt);
    }
  });
  if (window.DATOS_VISTA) arma(window.DATOS_VISTA);
  else fetch('datos.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(arma).catch(mant);
})();
