<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catálogo</title>
<style>
/* Página de catálogo de cada suscriptor (Tako 9.45): la misma para todos; lee datos.json de su carpeta.
   20 diseños (d.tema 1–20). Ficha de cada producto con sus fotos, carrito guardado en el celular y pedido por WhatsApp.
   No lleva el nombre de nadie. Se mete en el programa de Google y en Tako con lf/arma_pagina.js */
:root{--bg:#0e1215;--bgi:none;--bgs:auto;--card:#161c21;--tx:#e9eef1;--ctx:#e9eef1;--mu:#93a2ab;--ln:#2a343c;--ac:#e2342d;--acx:#fff;--hb:transparent;--ht:var(--tx);--r:14px;--fh:system-ui,sans-serif;--fb:system-ui,sans-serif;--bw:1px;--sh:0 1px 2px rgba(0,0,0,.25);--sh2:0 18px 40px rgba(0,0,0,.35);--soft:rgba(127,127,127,.12);--top:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);background-image:var(--bgi);background-size:var(--bgs);color:var(--tx);font:16px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.w{max-width:1080px;margin:0 auto;padding:0 18px}
h1,h2,h3,.fh{font-family:var(--fh);margin:0;font-weight:700}
.up h1,.up h2,.up h3,.up .fh{text-transform:uppercase;letter-spacing:.03em}
.r0{--r:0px}
/* barra de arriba (fija) */
#top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--top) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
#top.s{border-bottom-color:var(--ln);box-shadow:0 6px 18px rgba(0,0,0,.12)}
#top .w{display:flex;align-items:center;gap:12px;min-height:62px}
#tlogo{width:38px;height:38px;border-radius:calc(var(--r) * .6);object-fit:contain;background:#fff;flex:none}
#tini{width:38px;height:38px;border-radius:calc(var(--r) * .6);background:var(--ac);color:var(--acx);display:flex;align-items:center;justify-content:center;font:800 15px var(--fh);flex:none}
#tneg{flex:1;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(6px);transition:.25s}
#top.s #tneg{opacity:1;transform:none}
.ib{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:44px;padding:0 12px;border-radius:999px;border:var(--bw) solid var(--ln);background:var(--card);color:var(--ctx)}
.ib .n{position:absolute;top:-5px;right:-5px;min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--ac);color:var(--acx);font:800 12px/21px var(--fb);text-align:center}
.ib .n.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.35)}}
/* portada */
#hero{padding:26px 0 8px}
#hero .w{display:flex;flex-direction:column;gap:16px}
.hrow{display:flex;align-items:center;gap:16px}
#logo{width:78px;height:78px;flex:none;border-radius:var(--r);object-fit:contain;background:#fff;box-shadow:var(--sh)}
#logoX{width:78px;height:78px;flex:none;border-radius:var(--r);background:var(--ac);color:var(--acx);display:flex;align-items:center;justify-content:center;font:800 28px var(--fh);box-shadow:var(--sh)}
#neg{font-size:clamp(30px,7vw,52px);line-height:1.02}
#sub{color:var(--ac);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin-top:6px}
#desc{margin:0;color:var(--mu);font-size:16px;line-height:1.6;white-space:pre-line;max-width:640px}
#datos{display:flex;flex-wrap:wrap;gap:10px}
.dt{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r);background:var(--soft);font-size:14px;line-height:1.25}
.dt b{display:block;font-family:var(--fh);font-size:18px}
.dt small{color:var(--mu)}
#cont{display:flex;flex-wrap:wrap;gap:10px}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;border:var(--bw) solid var(--ln);background:var(--card);color:var(--ctx);text-decoration:none;font-weight:600;font-size:15px}
.bt.bp{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.bt{white-space:nowrap}
.h-caja #hb .bt.bp,.h-banda #hero .bt.bp,.h-tienda #hero .bt.bp{background:var(--ht);border-color:var(--ht);color:var(--hb)}
.bt.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.r0 .bt,.r0 .ib{border-radius:0}
.h-centro #hero .w,.h-banda #hero .w{align-items:center;text-align:center}
.h-centro .hrow,.h-banda .hrow{flex-direction:column}
.h-centro #cont,.h-centro #datos,.h-banda #cont,.h-banda #datos{justify-content:center}
.h-banda #hero{background:var(--hb);color:var(--ht);padding:34px 0 64px}
.h-banda #desc,.h-banda .dt small{color:var(--ht);opacity:.85}.h-banda #sub{color:var(--ht);opacity:.9}.h-banda .dt{background:rgba(255,255,255,.14)}
.h-banda #barra{margin-top:-34px}
.h-caja #hb{background:var(--hb);color:var(--ht);border-radius:var(--r);padding:22px;border:var(--bw) solid var(--ln);box-shadow:var(--sh2);position:relative;display:flex;flex-direction:column;gap:16px}
.h-caja #hb #desc,.h-caja #hb .dt small{color:var(--ht);opacity:.85}.h-caja #hb .dt{background:rgba(127,127,127,.16)}
.h-portada #foto{display:block;height:min(56vw,380px);margin:0 -18px;border-radius:0 0 calc(var(--r) * 1.6) calc(var(--r) * 1.6);background:var(--card) center/cover no-repeat;position:relative}
.h-portada #foto::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(transparent 55%,rgba(0,0,0,.35))}
.h-portada #hero{padding-top:0}.h-portada .hrow{margin-top:-52px;position:relative;align-items:flex-end;z-index:1}
.h-portada #logo,.h-portada #logoX{width:100px;height:100px;border:4px solid var(--bg)}
.h-tienda #hero{background:var(--hb);color:var(--ht);padding:22px 0}.h-tienda #desc{color:var(--ht);opacity:.8}.h-tienda .dt{background:rgba(255,255,255,.1)}.h-tienda .dt small{color:var(--ht);opacity:.7}
.h-banda #logoX,.h-caja #logoX,.h-tienda #logoX{background:var(--ht);color:var(--hb)}
#foto{display:none}
.h-tienda #top{color:var(--ht)}
/* buscador, categorías y orden (se quedan arriba al bajar) */
#barra{position:sticky;top:62px;z-index:20;padding:12px 0 8px;background:linear-gradient(var(--bg) 75%,transparent)}
.h-banda #barra{background:none;position:relative;top:auto}
#bus{display:flex;align-items:center;gap:10px;background:var(--card);color:var(--ctx);border:var(--bw) solid var(--ln);border-radius:var(--r);padding:0 8px 0 16px;min-height:54px;box-shadow:var(--sh)}
#bus input{flex:1;border:0;background:transparent;outline:none;min-width:0;padding:14px 0;font-size:16px}
#bus input::placeholder{color:var(--mu)}
#bus select{border:0;background:var(--soft);border-radius:calc(var(--r) * .6);padding:8px 10px;font-size:13px;max-width:130px;color:var(--ctx)}
#cats{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
#cats button{flex:none;display:flex;align-items:center;gap:8px;min-height:42px;padding:0 16px;border:var(--bw) solid var(--ln);background:var(--card);color:var(--ctx);border-radius:999px;font-weight:600;font-size:14px}
#cats button i{font-style:normal;font-size:12px;opacity:.65}
#cats button.on{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.r0 #cats button{border-radius:0}
/* secciones */
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:30px 0 14px}
.sh h2{font-size:clamp(22px,5vw,30px);line-height:1.1;color:var(--tx)}
.sh small{color:var(--mu);font-size:13px;white-space:nowrap}
.sh .ln{flex:1;height:2px;background:var(--ln);margin-bottom:10px;opacity:.6}
.nada{color:var(--mu);text-align:center;padding:40px 10px;border:2px dashed var(--ln);border-radius:var(--r)}
/* tarjetas */
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:720px){.g{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
@media(min-width:980px){.g{grid-template-columns:repeat(4,minmax(0,1fr))}}
.p{position:relative;background:var(--card);color:var(--ctx);border:var(--bw) solid var(--ln);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s;text-align:left;padding:0;font:inherit}
@media(hover:hover){.p:hover{transform:translateY(-3px);box-shadow:var(--sh2)}}
.p .fw{position:relative;aspect-ratio:1/1;background:var(--soft);overflow:hidden}
.p .fw img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
@media(hover:hover){.p:hover .fw img{transform:scale(1.04)}}
.sinf{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--mu)}
.sinf svg{width:42px;height:42px;opacity:.5}
.bd{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;background:var(--ac);color:var(--acx);font:700 11.5px var(--fb);letter-spacing:.03em;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.nf{position:absolute;bottom:10px;right:10px;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px}
.nf svg{width:13px;height:13px}
.p .tx{padding:12px 13px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.p .ct{color:var(--mu);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em}
.p b{font-size:15px;line-height:1.28}
.p small{color:var(--mu);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pie{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.pr{font:800 18px var(--fh);color:var(--ac)}
.pr.con{font-size:14px;color:var(--mu);font-weight:600}
.ink .pr{color:var(--ctx)}
.ad{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--ac);color:var(--acx);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.18)}
.r0 .ad{border-radius:0}
.ad.ok{background:#1fa855;color:#fff}
/* destacados más grandes */
.dest .g{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:720px){.dest .g{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* lista (menú) */
.l-lista .todo .g{display:flex;flex-direction:column;gap:12px}
.l-lista .todo .p{flex-direction:row;align-items:stretch}
.l-lista .todo .p .fw{width:118px;flex:none;aspect-ratio:auto;min-height:118px}
.l-lista .todo .p small{-webkit-line-clamp:2}
/* carrusel */
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car .p{flex:none;width:76%;max-width:340px;scroll-snap-align:start;background:var(--ac);color:var(--acx);border:0}
.car .p .pr,.car .p small,.car .p .ct{color:var(--acx);opacity:.92}.car .p .ad{background:var(--acx);color:var(--ac)}.car .p .bd{background:var(--acx);color:var(--ac)}
.l-carrusel .todo .g{display:flex;flex-direction:column;gap:12px}
.l-carrusel .todo .p{flex-direction:row}.l-carrusel .todo .p .fw{width:110px;flex:none;aspect-ratio:auto}
/* mosaico */
.l-mosaico .g{display:block;columns:2;column-gap:12px}
@media(min-width:720px){.l-mosaico .g{columns:3}}
.l-mosaico .p{break-inside:avoid;margin-bottom:12px;width:100%;border:0}
.l-mosaico .p .fw{aspect-ratio:3/4}.l-mosaico .p:nth-child(3n+2) .fw{aspect-ratio:1/1}.l-mosaico .p:nth-child(3n) .fw{aspect-ratio:4/5}
.l-mosaico .p .tx{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.82));color:#fff;padding:40px 12px 12px}
.l-mosaico .p small,.l-mosaico .p .ct{display:none}.l-mosaico .p .pr{color:#fff}.l-mosaico .nf{top:10px;bottom:auto}
/* cómo pedir */
#pasos{display:grid;grid-template-columns:1fr;gap:12px;margin:34px 0 0}
@media(min-width:720px){#pasos{grid-template-columns:repeat(3,1fr)}}
.ps{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:var(--r);background:var(--card);color:var(--ctx);border:var(--bw) solid var(--ln)}
.ps i{flex:none;width:38px;height:38px;border-radius:50%;background:var(--ac);color:var(--acx);display:flex;align-items:center;justify-content:center;font:800 17px var(--fh);font-style:normal}
.ps b{display:block;font-family:var(--fh);font-size:16px}.ps span{color:var(--mu);font-size:14px}
/* pie de página */
#pie{margin-top:40px;padding:34px 0 120px;background:var(--card);color:var(--ctx);border-top:var(--bw) solid var(--ln)}
#pie .w{display:flex;flex-direction:column;gap:14px}
#pie .pn{display:flex;align-items:center;gap:12px}
#pie .pn b{font-family:var(--fh);font-size:20px}
#pie p{margin:0;color:var(--mu);font-size:14px}
#pie .fecha{font-size:12px;color:var(--mu);opacity:.8}
/* botón flotante del carrito */
#fcar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);z-index:25;display:flex;align-items:center;gap:12px;min-height:58px;padding:0 10px 0 20px;border:0;border-radius:999px;background:var(--ac);color:var(--acx);box-shadow:0 12px 30px rgba(0,0,0,.35);font-weight:700;transition:transform .3s;max-width:calc(100% - 28px);white-space:nowrap}
#fcar.on{transform:translateX(-50%)}
#fcar span{padding:8px 14px;border-radius:999px;background:color-mix(in srgb,var(--acx) 18%,transparent)}
.r0 #fcar,.r0 #fcar span{border-radius:0}
/* hojas (ficha del producto y carrito) */
.fondo{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.fondo.on{opacity:1;pointer-events:auto}
.hoja{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;background:var(--card);color:var(--ctx);border-radius:calc(var(--r) * 1.4) calc(var(--r) * 1.4) 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 50px rgba(0,0,0,.35)}
.hoja.on{transform:none}
@media(min-width:720px){.hoja{left:auto;top:0;bottom:0;width:480px;max-height:none;border-radius:0;transform:translateX(105%)}}
.hc{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--ln)}
.hc h3{flex:1;font-size:19px}
.hx{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);color:var(--ctx);display:flex;align-items:center;justify-content:center}
.hb{overflow-y:auto;overscroll-behavior:contain;flex:1}
.hf{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);display:flex;flex-direction:column;gap:10px;background:var(--card)}
/* ficha */
.gal{position:relative;background:var(--soft)}
.gs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gs::-webkit-scrollbar{display:none}
.gs img,.gs .sinf{flex:none;width:100%;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:start}
.gdots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.gdots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 3px rgba(0,0,0,.4)}
.gdots i.on{background:#fff;width:20px;border-radius:4px}
.gmini{display:flex;gap:8px;padding:10px 16px 0;overflow-x:auto}
.gmini button{flex:none;width:62px;height:62px;padding:0;border-radius:calc(var(--r) * .6);overflow:hidden;border:2px solid transparent;background:none}
.gmini button.on{border-color:var(--ac)}
.gmini img{width:100%;height:100%;object-fit:cover}
.fi{padding:16px;display:flex;flex-direction:column;gap:10px}
.fi .ct{display:inline-flex;align-self:flex-start;padding:4px 10px;border-radius:999px;background:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.fi h2{font-size:26px;line-height:1.15}
.fi .pr{font-size:28px}
.fi .dd{color:var(--ctx);opacity:.88;line-height:1.65;white-space:pre-line;font-size:15.5px}
.fi .nota{display:flex;gap:10px;padding:12px;border-radius:var(--r);background:var(--soft);font-size:13.5px;color:var(--mu)}
.cant{display:flex;align-items:center;border:var(--bw) solid var(--ln);border-radius:999px;overflow:hidden;flex:none}
.cant button{width:46px;height:48px;border:0;background:none;color:var(--ctx);display:flex;align-items:center;justify-content:center}
.cant span{min-width:34px;text-align:center;font-weight:800}
.fila{display:flex;gap:10px;align-items:center}
.fila .bt{flex:1}
.r0 .cant{border-radius:0}
/* carrito */
.ci{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--ln)}
.ci .fw{width:74px;height:74px;flex:none;border-radius:calc(var(--r) * .7);overflow:hidden;background:var(--soft);padding:0;border:0}
.ci .fw img{width:100%;height:100%;object-fit:cover}
.ci .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ci .t b{font-size:15px;line-height:1.25}
.ci .t small{color:var(--mu)}
.ci .r{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ci .cant button{width:38px;height:38px}
.ci .q{border:0;background:none;color:var(--mu);font-size:13px;text-decoration:underline;padding:6px 0}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.tot b{font:800 24px var(--fh)}
.cv{padding:40px 20px;text-align:center;color:var(--mu)}
.cv svg{width:54px;height:54px;opacity:.45;margin-bottom:8px}
.cf{display:flex;flex-direction:column;gap:6px;padding:14px 16px}
.cf label{font-size:13px;color:var(--mu)}
.cf input,.cf textarea{width:100%;border:var(--bw) solid var(--ln);background:var(--bg);color:var(--tx);border-radius:calc(var(--r) * .6);padding:11px 12px;outline:none}
.cf textarea{resize:vertical;min-height:70px}
/* aviso */
#toast{position:fixed;left:50%;top:76px;z-index:60;transform:translate(-50%,-20px);opacity:0;pointer-events:none;padding:11px 18px;border-radius:999px;background:var(--tx);color:var(--bg);font-weight:700;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.3);transition:.25s;display:flex;align-items:center;gap:8px}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* foto en grande */
#vf{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:16px}
#vf img{max-width:100%;max-height:88vh;border-radius:8px}
#vf.on{display:flex}
/* adornos de cada diseño */
.deco{display:none}
.d-chispas #dch{display:block;width:100%;height:70px;margin-bottom:-34px}
.d-franjas #fr1,.d-franjas #fr2{display:block;height:14px;background:repeating-linear-gradient(-45deg,var(--ac) 0 14px,#111 14px 28px)}
.d-franjas .sh h2::before{content:"";display:inline-block;width:12px;height:12px;background:var(--ac);margin-right:10px;vertical-align:middle}
.d-adorno #ado{display:block;margin:0 auto;max-width:100%;color:var(--ac)}
.d-adorno .sh{justify-content:center;text-align:center}.d-adorno .sh .ln,.d-adorno .sh small{display:none}
.d-remaches .rv{display:block;position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#8b8f93 60%,#4a4e52);z-index:2}
.d-remaches #hb{border:4px solid var(--ht);outline:3px solid var(--hb)}
.d-remaches .sh h2{color:var(--tx)}
.d-neon #neg{text-shadow:0 0 22px color-mix(in srgb,var(--ac) 50%,transparent)}
